name: Mila CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install genlayer-test pytest
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run contract:test
      - run: genvm-lint check contracts/mila.py --json
      - run: npm audit --audit-level=high

  studionet:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require StudioNet secrets
        shell: bash
        run: |
          test -n "${GENLAYER_RPC_URL}"
          test -n "${GENLAYER_PRIVATE_KEY}"
          test -n "${GENLAYER_ACCOUNT}"
          test -n "${NEXT_PUBLIC_MILA_CONTRACT_ADDRESS}"
        env:
          GENLAYER_RPC_URL: ${{ secrets.GENLAYER_RPC_URL }}
          GENLAYER_PRIVATE_KEY: ${{ secrets.GENLAYER_PRIVATE_KEY }}
          GENLAYER_ACCOUNT: ${{ secrets.GENLAYER_ACCOUNT }}
          NEXT_PUBLIC_MILA_CONTRACT_ADDRESS: ${{ secrets.NEXT_PUBLIC_MILA_CONTRACT_ADDRESS }}
      - run: npm run verify:deployment
        env:
          GENLAYER_RPC_URL: ${{ secrets.GENLAYER_RPC_URL }}
          GENLAYER_PRIVATE_KEY: ${{ secrets.GENLAYER_PRIVATE_KEY }}
          GENLAYER_ACCOUNT: ${{ secrets.GENLAYER_ACCOUNT }}
          NEXT_PUBLIC_MILA_CONTRACT_ADDRESS: ${{ secrets.NEXT_PUBLIC_MILA_CONTRACT_ADDRESS }}
      - run: npm run integration:studionet
        env:
          GENLAYER_RPC_URL: ${{ secrets.GENLAYER_RPC_URL }}
          GENLAYER_PRIVATE_KEY: ${{ secrets.GENLAYER_PRIVATE_KEY }}
          GENLAYER_ACCOUNT: ${{ secrets.GENLAYER_ACCOUNT }}
          NEXT_PUBLIC_MILA_CONTRACT_ADDRESS: ${{ secrets.NEXT_PUBLIC_MILA_CONTRACT_ADDRESS }}
